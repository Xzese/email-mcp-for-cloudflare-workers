version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      ignore:
          # Keep Node typings aligned with the Node 22 CI target.
          - dependency-name: "@types/node"
            update-types:
                - version-update:semver-major
      groups:
          runtime:
              dependency-type: production
              update-types:
                  - minor
                  - patch
          build-tooling:
              dependency-type: development
              update-types:
                  - minor
                  - patch
      open-pull-requests-limit: 10
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      groups:
          github-actions-routine:
              update-types:
                  - minor
                  - patch
      open-pull-requests-limit: 10
