name: Generate Worker types for Dependabot

on:
    pull_request:
        types: [opened, reopened, synchronize]
        branches: [main]

permissions: {}

concurrency:
    group: dependabot-worker-types-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    generate:
        if: >-
            github.event.pull_request.user.login == 'dependabot[bot]' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            startsWith(github.event.pull_request.head.ref, 'dependabot/')
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - name: Check out Dependabot commit
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
                  persist-credentials: false

            - name: Use Node.js 22
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Regenerate Cloudflare Worker types
              run: npm run cf-typegen

            - name: Verify only the generated type file changed
              shell: bash
              run: |
                  set -euo pipefail

                  unexpected="$(
                    git diff --name-only -- . ':(exclude)worker-configuration.d.ts'
                  )"

                  if [[ -n "${unexpected}" ]]; then
                    echo "::error::Type generation changed unexpected tracked files:"
                    printf '%s\n' "${unexpected}"
                    exit 1
                  fi

                  test -f worker-configuration.d.ts
                  grep -Fq "Generated by Wrangler" worker-configuration.d.ts

            - name: Upload generated Worker types
              uses: actions/upload-artifact@v4
              with:
                  name: worker-types
                  path: worker-configuration.d.ts
                  if-no-files-found: error
                  retention-days: 1
