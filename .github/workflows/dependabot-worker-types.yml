name: Refresh Worker types for Dependabot

on:
    pull_request_target:
        types: [opened, reopened, synchronize]
        branches: [main]

permissions: {}

jobs:
    generate:
        if: >-
            github.event.pull_request.user.login == 'dependabot[bot]' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            startsWith(github.event.pull_request.head.ref, 'dependabot/')
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - name: Check out Dependabot commit
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
                  persist-credentials: false

            - name: Use Node.js 22
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Regenerate Cloudflare Worker types
              run: npm run cf-typegen

            - name: Verify only the generated type file changed
              shell: bash
              run: |
                  set -euo pipefail

                  unexpected="$(
                    git diff --name-only -- . ':(exclude)worker-configuration.d.ts'
                  )"

                  if [[ -n "${unexpected}" ]]; then
                    echo "::error::Type generation changed unexpected tracked files:"
                    printf '%s\n' "${unexpected}"
                    exit 1
                  fi

                  test -f worker-configuration.d.ts
                  grep -Fq "Generated by Wrangler" worker-configuration.d.ts

            - name: Upload generated Worker types
              uses: actions/upload-artifact@v4
              with:
                  name: worker-types
                  path: worker-configuration.d.ts
                  if-no-files-found: error
                  retention-days: 1

    commit:
        needs: generate
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - name: Download generated Worker types
              uses: actions/download-artifact@v5
              with:
                  name: worker-types
                  path: generated

            - name: Validate artifact
              shell: bash
              run: |
                  set -euo pipefail

                  test -f generated/worker-configuration.d.ts
                  test ! -L generated/worker-configuration.d.ts
                  grep -Fq "Generated by Wrangler" generated/worker-configuration.d.ts

                  size="$(wc -c < generated/worker-configuration.d.ts)"
                  if (( size > 5000000 )); then
                    echo "::error::Generated type file is unexpectedly large: ${size} bytes"
                    exit 1
                  fi

                  count="$(find generated -type f | wc -l)"
                  if [[ "${count}" -ne 1 ]]; then
                    echo "::error::Artifact contained unexpected files."
                    find generated -maxdepth 2 -type f -print
                    exit 1
                  fi

            - name: Update generated type file on Dependabot branch
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.DEPENDABOT_WRITE_PAT }}
                  HEAD_REF: ${{ github.event.pull_request.head.ref }}
              run: |
                  set -euo pipefail

                  gh api                     "repos/${GITHUB_REPOSITORY}/contents/worker-configuration.d.ts?ref=${HEAD_REF}"                     > current.json

                  python <<'PY'
                  import base64
                  import json
                  import os
                  from pathlib import Path

                  generated = Path("generated/worker-configuration.d.ts").read_bytes()
                  current = json.loads(Path("current.json").read_text())
                  existing = base64.b64decode(current["content"])

                  if generated == existing:
                      Path("no-update").touch()
                  else:
                      payload = {
                          "message": "chore: regenerate Cloudflare Worker types",
                          "content": base64.b64encode(generated).decode("ascii"),
                          "sha": current["sha"],
                          "branch": os.environ["HEAD_REF"],
                      }
                      Path("update.json").write_text(json.dumps(payload))
                  PY

                  if [[ -f no-update ]]; then
                    echo "Worker types are already current."
                    exit 0
                  fi

                  gh api                     --method PUT                     "repos/${GITHUB_REPOSITORY}/contents/worker-configuration.d.ts"                     --input update.json                     >/dev/null

                  echo "Updated worker-configuration.d.ts on ${HEAD_REF}."
