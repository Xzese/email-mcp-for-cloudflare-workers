name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    checks:
        runs-on: ubuntu-latest
        steps:
            - name: Check out source
              uses: actions/checkout@v4

            - name: Use Node.js 22
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Check formatting
              run: npm run format:check

            - name: Lint
              run: npm run lint

            - name: Type-check
              run: npm run type-check

            - name: Test
              run: npm test

            - name: Check generated Worker types
              run: npm run cf-typegen:check

            - name: Check public configuration
              run: npm run public-config:check
