name: Commit Worker types for Dependabot

on:
    workflow_run:
        workflows: ["Generate Worker types for Dependabot"]
        types: [completed]

permissions: {}

jobs:
    commit-and-test:
        if: >-
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.event == 'pull_request'
        runs-on: ubuntu-latest
        permissions:
            actions: write
            contents: write
            pull-requests: read

        steps:
            - name: Resolve and validate Dependabot PR
              id: pr
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
                  PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
              run: |
                  set -euo pipefail

                  : "${PR_NUMBER:?Workflow run is not associated with a pull request}"

                  gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > pr.json

                  author="$(jq -r '.user.login' pr.json)"
                  state="$(jq -r '.state' pr.json)"
                  base_ref="$(jq -r '.base.ref' pr.json)"
                  head_ref="$(jq -r '.head.ref' pr.json)"
                  head_repo="$(jq -r '.head.repo.full_name' pr.json)"
                  head_sha="$(jq -r '.head.sha' pr.json)"

                  [[ "${author}" == "dependabot[bot]" ]]
                  [[ "${state}" == "open" ]]
                  [[ "${base_ref}" == "main" ]]
                  [[ "${head_repo}" == "${GITHUB_REPOSITORY}" ]]
                  [[ "${head_ref}" == dependabot/* ]]
                  [[ "${head_sha}" == "${RUN_HEAD_SHA}" ]]

                  echo "number=${PR_NUMBER}" >> "${GITHUB_OUTPUT}"
                  echo "head_ref=${head_ref}" >> "${GITHUB_OUTPUT}"
                  echo "head_sha=${head_sha}" >> "${GITHUB_OUTPUT}"

            - name: Download generated Worker types
              uses: actions/download-artifact@v5
              with:
                  name: worker-types
                  path: generated
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  run-id: ${{ github.event.workflow_run.id }}

            - name: Validate artifact
              shell: bash
              run: |
                  set -euo pipefail

                  test -f generated/worker-configuration.d.ts
                  test ! -L generated/worker-configuration.d.ts
                  grep -Fq "Generated by Wrangler" generated/worker-configuration.d.ts

                  size="$(wc -c < generated/worker-configuration.d.ts)"
                  if (( size > 5000000 )); then
                    echo "::error::Generated type file is unexpectedly large: ${size} bytes"
                    exit 1
                  fi

                  count="$(find generated -type f | wc -l)"
                  if [[ "${count}" -ne 1 ]]; then
                    echo "::error::Artifact contained unexpected files."
                    find generated -maxdepth 2 -type f -print
                    exit 1
                  fi

            - name: Update generated type file if needed
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  HEAD_REF: ${{ steps.pr.outputs.head_ref }}
                  EXPECTED_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
              run: |
                  set -euo pipefail

                  gh api "repos/${GITHUB_REPOSITORY}/contents/worker-configuration.d.ts?ref=${HEAD_REF}" > current.json

                  python <<'PY'
                  import base64
                  import json
                  import os
                  from pathlib import Path

                  generated = Path("generated/worker-configuration.d.ts").read_bytes()
                  current = json.loads(Path("current.json").read_text())
                  existing = base64.b64decode(current["content"])

                  if generated == existing:
                      Path("no-update").touch()
                  else:
                      payload = {
                          "message": "chore: regenerate Cloudflare Worker types",
                          "content": base64.b64encode(generated).decode("ascii"),
                          "sha": current["sha"],
                          "branch": os.environ["HEAD_REF"],
                      }
                      Path("update.json").write_text(json.dumps(payload))
                  PY

                  latest_sha="$(
                    gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${HEAD_REF}" --jq '.object.sha'
                  )"

                  if [[ "${latest_sha}" != "${EXPECTED_HEAD_SHA}" ]]; then
                    echo "::error::Dependabot branch changed while generated types were being prepared."
                    exit 1
                  fi

                  if [[ ! -f no-update ]]; then
                    gh api                       --method PUT                       "repos/${GITHUB_REPOSITORY}/contents/worker-configuration.d.ts"                       --input update.json                       >/dev/null
                    echo "Updated worker-configuration.d.ts on ${HEAD_REF}."
                  else
                    echo "Worker types are already current."
                  fi

            - name: Dispatch CI on current Dependabot branch
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  HEAD_REF: ${{ steps.pr.outputs.head_ref }}
              run: |
                  set -euo pipefail
                  gh workflow run ci.yml --ref "${HEAD_REF}"
                  echo "Dispatched CI for ${HEAD_REF}."
